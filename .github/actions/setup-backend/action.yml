name: 'Setup Python Environment'
description: 'Set up Python and install dependencies with optional configurations.'
inputs:
  python-version:
    description: 'Python version to set up. Accepts a version number, "current", or "next".'
    required: true
    default: 'current'
  cache:
    description: 'Optional dependency cache passed to actions/setup-python. Options: pip'
    required: false
    default: ''
  requirements-type:
    description: 'Type of requirements to install. Options: base, development, default'
    required: false
    default: 'dev'
  install-superset:
    description: 'Whether to install Superset itself. If false, only python is installed'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Interpret Python Version
      id: set-python-version
      shell: bash
      run: |
        if [ "${{ inputs.python-version }}" = "current" ]; then
          echo "PYTHON_VERSION=3.11" >> $GITHUB_ENV
        elif [ "${{ inputs.python-version }}" = "next" ]; then
          # currently disabled in GHA matrixes because of library compatibility issues
          echo "PYTHON_VERSION=3.12" >> $GITHUB_ENV
        elif [ "${{ inputs.python-version }}" = "previous" ]; then
          echo "PYTHON_VERSION=3.10" >> $GITHUB_ENV
        else
          echo "PYTHON_VERSION=${{ inputs.python-version }}" >> $GITHUB_ENV
        fi
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: ${{ inputs.cache }}
    - name: Install dependencies
      run: |
        if [ "${{ inputs.install-superset }}" = "true" ]; then
          sudo apt-get update && sudo apt-get -y install libldap2-dev libsasl2-dev

          # Bootstrap patched pip from a hash-pinned wheel before performing any
          # unconstrained package resolution through the runner trust store.
          python -m pip install --no-cache-dir \
            "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install --no-cache-dir --upgrade setuptools wheel "uv==0.13.5"
          python -c 'import pip; assert pip.__version__ == "26.2.2"'
          [[ "$(uv --version)" == "uv 0.13.5"* ]]

          if [ "${{ inputs.requirements-type }}" = "dev" ]; then
            uv pip install --system -r requirements/development.txt
          elif [ "${{ inputs.requirements-type }}" = "base" ]; then
            uv pip install --system -r requirements/base.txt
          fi

          uv pip install --system -e .
        fi
      shell: bash
